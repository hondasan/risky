<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RISKY DICE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Shippori+Mincho:wght@800&display=swap');

        :root {
            --nen-green: #39ff14;
            --nen-green-glow: rgba(57, 255, 20, 0.5);
            --danger-red: #ff003c;
            --danger-red-glow: rgba(255, 0, 60, 0.6);
            --void-black: #050505;
            --metal-gray: #2a2a2a;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--void-black);
            color: white;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 背景のアニメーション（オーラ） */
        #aura-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 70%);
            z-index: -2;
            transition: background 0.5s ease;
        }

        /* UI コンテナ */
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        /* ヘッダー情報 */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            text-shadow: 0 0 10px var(--nen-green-glow);
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--nen-green);
            padding: 10px 15px;
            border-radius: 4px;
            text-align: center;
            backdrop-filter: blur(4px);
            min-width: 80px;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #aaa;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--nen-green);
        }

        /* 3Dキャンバス */
        #dice-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* メインアクションエリア */
        .action-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 50px;
            pointer-events: auto;
            width: 100%;
        }

        /* 結果表示オーバーレイ */
        #result-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 20;
            pointer-events: none;
            width: 100%;
        }

        .result-title {
            font-family: 'Shippori Mincho', serif;
            font-size: 5rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: 0.5rem;
            text-shadow: 0 0 20px currentColor;
            white-space: nowrap;
        }

        .result-subtitle {
            font-size: 1.2rem;
            margin-top: 10px;
            letter-spacing: 0.2rem;
            text-shadow: 0 0 5px currentColor;
        }

        /* ダイスロールボタン */
        #roll-btn {
            background: transparent;
            border: 2px solid var(--nen-green);
            color: var(--nen-green);
            padding: 20px 60px;
            font-size: 1.5rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px var(--nen-green-glow);
            clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%);
        }

        #roll-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(57, 255, 20, 0.4), transparent);
            transition: 0.5s;
        }

        #roll-btn:hover::before {
            left: 100%;
        }

        #roll-btn:hover {
            background: rgba(57, 255, 20, 0.1);
            transform: scale(1.05);
            box-shadow: 0 0 30px var(--nen-green-glow);
        }

        #roll-btn:active {
            transform: scale(0.95);
        }

        #roll-btn:disabled {
            border-color: #555;
            color: #555;
            box-shadow: none;
            cursor: not-allowed;
            background: rgba(0,0,0,0.8);
        }

        /* 絶望エフェクト用のオーバーレイ */
        #glitch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            pointer-events: none;
            z-index: 100;
            mix-blend-mode: overlay;
            display: none;
        }

        /* ---------------- アニメーション & クラス ---------------- */

        /* 大吉モード */
        .mode-lucky {
            --current-color: var(--nen-green);
        }
        
        .mode-lucky .result-title {
            color: var(--nen-green);
        }

        /* 大凶モード */
        .mode-disaster {
            --current-color: var(--danger-red);
        }

        .mode-disaster .result-title {
            color: var(--danger-red);
            animation: shake 0.1s infinite;
        }

        /* 画面揺れ */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .screen-shake-mild { animation: shake 0.5s; }
        .screen-shake-hard { animation: shake 0.1s infinite; }

        /* グリッチ効果 */
        .glitch-active {
            animation: glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
            filter: contrast(150%) brightness(80%) sepia(100%) hue-rotate(-50deg) saturate(200%);
        }

        @keyframes glitch-skew {
            0% { transform: skew(0deg); }
            20% { transform: skew(-20deg); }
            40% { transform: skew(20deg); }
            60% { transform: skew(-5deg); }
            80% { transform: skew(5deg); }
            100% { transform: skew(0deg); }
        }

        /* ノイズライン */
        .scanline {
            width: 100%;
            height: 100px;
            z-index: 99;
            background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(255, 0, 0, 0.2) 50%, rgba(0,0,0,0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scanline 10s linear infinite;
            pointer-events: none;
        }
        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: -100%; }
        }

        /* レスポンシブ調整 */
        @media (max-width: 600px) {
            .result-title { font-size: 3.5rem; }
            .result-subtitle { font-size: 1rem; }
            #roll-btn { padding: 15px 40px; font-size: 1.2rem; }
            .stats-bar { padding: 0 10px; }
        }
    </style>
</head>
<body>

    <!-- 背景オーラ -->
    <div id="aura-bg"></div>
    <div class="scanline"></div>
    <div id="glitch-overlay"></div>

    <!-- 3D表示エリア -->
    <canvas id="dice-canvas"></canvas>

    <!-- UI -->
    <div class="ui-container">
        <!-- 上部ステータス -->
        <div class="stats-bar">
            <div class="stat-box">
                <div class="stat-label">STREAK</div>
                <div class="stat-value" id="streak-val">0</div>
            </div>
            <div style="flex-grow: 1;"></div>
            <div class="stat-box">
                <div class="stat-label">BEST</div>
                <div class="stat-value" id="best-val">0</div>
            </div>
        </div>

        <!-- 結果表示 -->
        <div id="result-overlay">
            <h1 class="result-title" id="res-main"></h1>
            <div class="result-subtitle" id="res-sub"></div>
        </div>

        <!-- アクションボタン -->
        <div class="action-area">
            <button id="roll-btn">ROLL THE DICE</button>
            <div style="margin-top: 10px; font-size: 0.7rem; color: #555; letter-spacing: 1px;">ODDS: 95% LUCK / 5% DESPAIR</div>
        </div>
    </div>

<script>
    /**
     * アプリケーションの状態管理
     */
    const STATE = {
        streak: 0,
        best: parseInt(localStorage.getItem('risky_best')) || 0,
        isRolling: false,
        isLocked: false // 大凶時の操作不能ロック
    };

    // DOM要素
    const dom = {
        streak: document.getElementById('streak-val'),
        best: document.getElementById('best-val'),
        rollBtn: document.getElementById('roll-btn'),
        resOverlay: document.getElementById('result-overlay'),
        resMain: document.getElementById('res-main'),
        resSub: document.getElementById('res-sub'),
        auraBg: document.getElementById('aura-bg'),
        glitchOverlay: document.getElementById('glitch-overlay'),
        body: document.body
    };

    // 初期表示更新
    dom.streak.innerText = STATE.streak;
    dom.best.innerText = STATE.best;

    /* ------------------------------------------------------------
       AUDIO ENGINE (Web Audio API) - SEファイルなしで音を生成
    ------------------------------------------------------------ */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    const audio = {
        // マスターボリューム
        masterGain: null,

        init() {
            if (this.masterGain) return;
            this.masterGain = audioCtx.createGain();
            this.masterGain.gain.value = 0.3; // 音量調整
            this.masterGain.connect(audioCtx.destination);
        },

        // ロール中の回転音（チャージ）
        playRoll() {
            this.init();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(50, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 1.5);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(100, audioCtx.currentTime);
            filter.frequency.linearRampToValueAtTime(2000, audioCtx.currentTime + 1.5);

            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(this.masterGain);

            osc.start();
            osc.stop(audioCtx.currentTime + 1.5);
        },

        // 大吉：聖なる和音
        playWin(streak) {
            this.init();
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C Major
            const now = audioCtx.currentTime;
            
            // Streakが高いとピッチが少し上がる（高揚感）
            const pitchMod = Math.min(streak * 10, 200);

            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq + pitchMod, now);
                
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.1, now + 0.1 + (i*0.05));
                gain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);

                osc.connect(gain);
                gain.connect(this.masterGain);
                
                osc.start();
                osc.stop(now + 2.5);
            });
        },

        // 大凶：恐怖の不協和音とノイズ
        playLoss(intensity) {
            this.init();
            const now = audioCtx.currentTime;
            
            // 1. 衝撃音（低音）
            const kickOsc = audioCtx.createOscillator();
            const kickGain = audioCtx.createGain();
            kickOsc.frequency.setValueAtTime(150, now);
            kickOsc.frequency.exponentialRampToValueAtTime(0.01, now + 0.5);
            kickGain.gain.setValueAtTime(1, now);
            kickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            kickOsc.connect(kickGain);
            kickGain.connect(this.masterGain);
            kickOsc.start();
            kickOsc.stop(now + 0.5);

            // 2. 悲鳴（高周波ノイズと不協和音）
            const screamDuration = 1 + (intensity * 0.2); // 絶望度で長さが変わる
            
            for (let i = 0; i < 3 + (intensity / 5); i++) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = intensity > 10 ? 'sawtooth' : 'square';
                // ランダムな不快な周波数
                const freq = 200 + Math.random() * 800;
                osc.frequency.setValueAtTime(freq, now);
                // 周波数を揺らして悲鳴感を出す
                osc.frequency.linearRampToValueAtTime(freq * (Math.random() > 0.5 ? 0.5 : 2), now + screamDuration);
                
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + screamDuration);

                osc.connect(gain);
                gain.connect(this.masterGain);
                osc.start();
                osc.stop(now + screamDuration);
            }
        }
    };


    /* ------------------------------------------------------------
       THREE.JS SETUP (3D Dice)
    ------------------------------------------------------------ */
    const canvas = document.getElementById('dice-canvas');
    const scene = new THREE.Scene();
    
    // カメラ
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 5;

    // レンダラー
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // ライティング (金属感を出す)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0x39ff14, 2, 10); // Green Aura Light
    pointLight.position.set(2, 2, 2);
    scene.add(pointLight);
    
    const pointLight2 = new THREE.PointLight(0xff003c, 0, 10); // Red Aura Light (Initially off)
    pointLight2.position.set(-2, -2, 2);
    scene.add(pointLight2);

    // ダイス（二十面体）
    // 質感：暗い金属
    const geometry = new THREE.IcosahedronGeometry(1.2, 0);
    const material = new THREE.MeshStandardMaterial({
        color: 0x111111,
        metalness: 0.9,
        roughness: 0.2,
        emissive: 0x002200,
        emissiveIntensity: 0.2,
        flatShading: true
    });
    
    const dice = new THREE.Mesh(geometry, material);
    
    // ワイヤーフレーム（サイバー感を出すため）
    const wireGeo = new THREE.WireframeGeometry(geometry);
    const wireMat = new THREE.LineBasicMaterial({ color: 0x39ff14, transparent: true, opacity: 0.3 });
    const wireframe = new THREE.LineSegments(wireGeo, wireMat);
    dice.add(wireframe);

    scene.add(dice);

    // アニメーションループ
    function animate() {
        requestAnimationFrame(animate);
        
        // アイドリング回転
        if (!STATE.isRolling && !STATE.isLocked) {
            dice.rotation.x += 0.002;
            dice.rotation.y += 0.003;
        }

        renderer.render(scene, camera);
    }
    animate();

    // リサイズ対応
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    /* ------------------------------------------------------------
       GAME LOGIC
    ------------------------------------------------------------ */

    // 演出リセット
    function resetVisuals() {
        dom.resOverlay.style.opacity = '0';
        dom.resOverlay.className = ''; // Remove luck/disaster classes
        dom.body.classList.remove('screen-shake-mild', 'screen-shake-hard', 'glitch-active');
        dom.glitchOverlay.style.display = 'none';
        
        // 色を通常（緑）に戻す
        wireMat.color.setHex(0x39ff14);
        pointLight.intensity = 2;
        pointLight2.intensity = 0;
        dom.auraBg.style.background = `radial-gradient(circle at center, #1a1a1a 0%, #000 70%)`;
        
        // ボタン復活
        dom.rollBtn.disabled = false;
        dom.rollBtn.innerText = "ROLL THE DICE";
    }

    // ダイスロール処理
    dom.rollBtn.addEventListener('click', async () => {
        if (STATE.isRolling || STATE.isLocked) return;

        // Audio Context再開（ブラウザ制限対策）
        if (audioCtx.state === 'suspended') audioCtx.resume();

        STATE.isRolling = true;
        dom.rollBtn.disabled = true;
        dom.rollBtn.innerText = "ROLLING...";
        resetVisuals();

        audio.playRoll();

        // 回転アニメーション
        const startTime = Date.now();
        const duration = 1500; // 1.5秒回転

        const rotateAnim = setInterval(() => {
            // ランダムに激しく回転
            dice.rotation.x += Math.random() * 0.5;
            dice.rotation.y += Math.random() * 0.5;
            dice.rotation.z += Math.random() * 0.5;
        }, 16);

        // 結果判定待ち
        await new Promise(r => setTimeout(r, duration));
        clearInterval(rotateAnim);

        // 結果抽選 (5% 大凶)
        const isDisaster = Math.random() < 0.05;
        
        finalizeRoll(isDisaster);
    });

    function finalizeRoll(isDisaster) {
        STATE.isRolling = false;

        // ダイスを正面に向ける演出（簡易的に回転を止める）
        // 実際は特定面を向ける計算が必要だが、演出優先で回転を減衰させる
        dice.rotation.set(0, 0, 0); 
        
        // 少しランダムな角度をつけて自然に見せる
        dice.rotation.x = Math.random();
        dice.rotation.y = Math.random();

        if (isDisaster) {
            handleDisaster();
        } else {
            handleLuck();
        }
    }

    /* ------------------------------------------------------------
       RESULT HANDLERS
    ------------------------------------------------------------ */

    function handleLuck() {
        STATE.streak++;
        if (STATE.streak > STATE.best) {
            STATE.best = STATE.streak;
            localStorage.setItem('risky_best', STATE.best);
            dom.best.innerText = STATE.best;
            // Best更新時は少し豪華に
            dom.best.style.color = '#fff';
            setTimeout(() => dom.best.style.color = 'var(--nen-green)', 500);
        }
        dom.streak.innerText = STATE.streak;

        // 演出：大吉
        dom.resOverlay.classList.add('mode-lucky');
        dom.resMain.innerText = "大 吉";
        dom.resSub.innerText = "GREAT LUCK - STREAK INCREASED";
        dom.resOverlay.style.opacity = '1';

        // ダイス発光
        wireMat.color.setHex(0x39ff14);
        pointLight.intensity = 4;
        
        // オーラ強化 (Streakに応じて明るく)
        const lightLevel = Math.min(20 + (STATE.streak * 2), 50);
        dom.auraBg.style.background = `radial-gradient(circle at center, #2a4a2a ${lightLevel}%, #000 80%)`;

        audio.playWin(STATE.streak);

        setTimeout(resetVisuals, 2000);
    }

    function handleDisaster() {
        // 絶望レベル計算 (Streakが高いほどダメージでかい)
        const despairLevel = STATE.streak;
        
        // データリセット
        const lostStreak = STATE.streak;
        STATE.streak = 0;
        dom.streak.innerText = 0;
        
        // ロックダウン（操作不能時間）
        STATE.isLocked = true;
        let lockoutTime = 3000; // 基本3秒

        // 演出：大凶
        dom.resOverlay.classList.add('mode-disaster');
        dom.resMain.innerText = "大 凶";
        dom.resSub.innerText = `YOU LOST EVERYTHING (${lostStreak} STREAK)`;
        dom.resOverlay.style.opacity = '1';

        // ダイス赤色化
        wireMat.color.setHex(0xff003c);
        pointLight.intensity = 0;
        pointLight2.intensity = 5;

        // 背景赤黒く
        dom.auraBg.style.background = `radial-gradient(circle at center, #330000 0%, #000 90%)`;

        audio.playLoss(despairLevel);

        // ---------------- 可変する絶望演出 ----------------

        // Level 1: 低Streak (0-5) - 軽い揺れ
        if (despairLevel <= 5) {
            dom.body.classList.add('screen-shake-mild');
        } 
        // Level 2: 中Streak (6-19) - 激しい揺れ + ノイズ
        else if (despairLevel < 20) {
            dom.body.classList.add('screen-shake-hard');
            dom.glitchOverlay.style.display = 'block';
            lockoutTime = 5000;
        } 
        // Level 3: 高Streak (20+) - 崩壊
        else {
            dom.body.classList.add('screen-shake-hard', 'glitch-active');
            dom.glitchOverlay.style.display = 'block';
            dom.glitchOverlay.style.backgroundColor = 'rgba(255,0,0,0.1)';
            
            // UIをバグらせる
            dom.resMain.innerText = "死"; // "Death" symbol override
            dom.streak.innerText = "ERR";
            
            lockoutTime = 8000 + (despairLevel * 100); // 絶望的に長い待機時間
        }

        // ロック解除カウントダウン演出
        dom.rollBtn.innerText = "REBOOTING SYSTEM...";
        
        setTimeout(() => {
            STATE.isLocked = false;
            // 完全にUIを戻す
            dom.streak.innerText = 0; 
            resetVisuals();
        }, lockoutTime);
    }

</script>
</body>
</html>
